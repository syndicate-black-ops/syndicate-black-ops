// Use this file to configure your LISTEN server.
// This config file is executed every time the server changes levels.


// If you run a listen server and choose to modify this file,
// note that assigning values to the following variables within
// this file will stomp the choices you make in the Launcher
// server configuration "Advanced Options" screen:
//
// hostname
// maxplayers
// password
// mp_fraglimit
// mp_timelimit
// mp_falldamage
// mp_friendlyfire
// mp_forcerespawn
// mp_footsteps
// mp_flashlight
// mp_autocrosshair
// teamplay
//
// and, in Syndicate Black Ops, the other options of the Launcher's "Create Server" screen:
//
// sv_lan
// mp_hardcore
// mp_juniorpowmonst
// mp_junioracmar
// mp_juniorpvmonst
// mp_makermon
// mp_speedmon
// mp_ban
// mp_junior
// mp_easymode
// mp_gmmode
// mp_XP
//
// A listen server started with +map or the "map" console command is called "Syndicate Black Ops Server".
// For another name, put hostname "My Server" in this file, or +hostname "My Server" on the command line.
//
// The game settings among them are listed below with their default values, commented out, so that the
// Launcher's choices apply. Remove the "//" in front of one to force its value.


// disable autoaim
sv_aim 0

// player bounding boxes (collisions, not clipping)
sv_clienttrace 3.5

// disable clients' ability to pause the server
pausable 0

// maximum client movement speed
sv_maxspeed 2000

// maximum speed of a free-roaming spectator
sv_spectatormaxspeed 500

// time limit in minutes, 0 = none (not used on co_ maps)
// mp_timelimit 20

// frag limit, 0 = none (not used on co_ maps)
// mp_fraglimit 0

// seconds the scoreboard stays up at the end of a map before the next map loads
// mp_chattime 10

// percentage of the team that must be killed for the round to fail, from 0 to 100 (co_ only)
// mp_hardcore 100

// seconds a player without a loadout can hold up the round start; then the round starts without that player,
// who joins the next round (0 = wait for everybody) (co_ and br_)
// mp_loadouttime 45

// seconds from the mission result to the map change; above 5, the players still alive spectate after 5 s (co_ only)
// mp_missionendtime 5

// seconds without any input until the AFK sign shows above a player in play (default 60; 0 turns it off)
//mp_afk_time 60

// seconds without any input until a player in play is moved to spectator mode (default 0 = off; set seconds to turn it on)
//mp_afk_spectate_time 0

// semiclip: players walk through each other for a while after a round start (1 = on, 0 = off)
// mp_semiclip 1

// seconds after a round start (co_, br_) or the map start until players are solid again, 0 to 180 (0 = never solid)
// mp_semiclip_time 15

// 1 = players that can be walked through fade the nearer they are; 0 = fixed transparency, and only within 200 units
// mp_semiclip_effects 1

// Difficulty (co_ only)
// mp_juniorpowmonst 1 // monster power level: 0 junior, 1 normal, 2 hardcore, 3 very powerful
// mp_junioracmar 1 // marines' ability: 0 junior, 1 normal, 2 veteran, 3 elite
// mp_juniorpvmonst 1 // monster health level: 0 junior, 1 normal, 2 hardcore, 3 survivor
// mp_makermon 1 // monster maker production: 0 half, 1 normal, 2 double, 3 triple
// mp_speedmon 1 // monster maker production speed: 0 half, 1 normal, 2 double, 3 triple
// mp_junior 0 // junior (newbie) mode: 1 = players take less damage from head, chest and stomach hits
// mp_easymode 1 // 1 = maximum number of rounds x 1.5

// friendly fire: 1 = players can hurt their teammates
// mp_friendlyfire 1

// 1 = punish team killers (co_ only)
// mp_ban 0

// game master (gm) mode: 1 = a player can become game master and create monsters in game
// mp_gmmode 0

// XP mode: 1 = players earn XP and levels from fighting monsters
// mp_XP 1

// kill feed rows for monsters: 0 = none, 1 = monsters killing players and players killing monsters (default),
// 2 = monsters killing players only. Best left commented out: a line here overrides the setting a map makes
// in its own maps/<map>_load.cfg
// mp_killfeed_npc 1

// footsteps: 1 = players' footsteps can be heard
// mp_footsteps 1

// flashlight: 1 = players can use their flashlight
// mp_flashlight 1

// 1 = dead players respawn by themselves after 5 seconds
// mp_forcerespawn 1

// 1 = the crosshair shows when autoaim has a target (only with autoaim, see sv_aim)
// mp_autocrosshair 1

// seconds a player must wait between two spray logos
// decalfrequency 30

// 1 = no speed cap on bunny hopping
// sv_allowbunnyhopping 0

// 1 = weapons use no ammo and never need a reload
// sv_infinite_ammo 0

// client rate limits: at least 25000 bytes a second (no cap), 30 to 100 updates a second
sv_minrate 25000
sv_minupdaterate 30
sv_maxupdaterate 100

// Other settings (default values; remove the "//" to change one)

// 1 = the custom maps listed in maps/map_compat.txt play as they were made; 0 = off
// mp_map_compat 1

// 1 = weapons lying in the map stay after a player picks them up
// mp_weaponstay 0

// pulling a pushable object (+use): its speed per second (below 0: per frame)
// sv_pushable_fixed_tick_fudge 15

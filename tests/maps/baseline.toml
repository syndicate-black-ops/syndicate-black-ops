# Map test baseline: every known difference between the 1.38 server .so and develop in the map tests
# (scripts/run_map_tests.sh, docs/dev/MAP_TESTS.md). The run fails on a difference not listed here, on a listed one that
# no longer shows, or on one whose counts changed, so this list is always what develop does differently from 1.38.
#
# [[decision]]: why a group of differences is accepted.
#   status  approved           an approved change (the decision named in reason)
#           same-total         the same lines at another moment; the run also checks that each line's total over the
#                              test is equal on both binaries
#           pending-fix        a regression being fixed on the branch named in reason; the merge removes its entries
#           awaiting-decision  a difference not decided yet; listed so the run stays useful until it is
# [[known_bug]]: a bug a spec case (a "# covers:" case in tests/maps/cases) shows on develop; the case names it with
#   "# known-bug: <id>" and must keep failing on develop until the bug is fixed (then the tag and the entry go).
#   id / reason (what the FGD or docs say, what the code does, the maps that use it).
# [[difference]]: one compared line, written by --update-baseline (new ones get decision "unreviewed", which fails).
#   suite / test  replay + map name, or cases + case file name (tests/maps/cases/)
#   segment       replay: the action the line followed (@@FIRE <targetname>, @@TOUCH ..., @@MARK ..., @start at load);
#                 cases: @start; @result: a crash, hang or a run that did not finish
#   line          the compared line; legacy / develop: how often each binary printed it

[[decision]]
id = "multisource-delayed-own-slot"
status = "approved"
reason = "Approved 2026-11-11 (fix/logic-bugs-fgd-text): a multisource input with a Delay before trigger fires through a temporary DelayedUse entity, which is not a member; CMultiSource::Use now toggles the slot of the member whose delay made it (CBaseDelay::m_hDelayedCaller). 1.38 (Half-Life SDK) toggled the last member's slot, so a delayed input that is not the last member turned the last input off instead of its own on. Any other non-member still toggles the last slot. Maps: delayed members only on co_spells (teleporter_lock, teleport_helicopter_lock) and co_station / co_station_v1 (lock_ending_shuttle, lock_fed_makers_kill), each the multisource's only member, so own slot = last slot and no map plays differently (scan 2026-11-11, spawners counted). Case 70c_multisource_delayed_member (ms2)."

[[decision]]
id = "round-mission-hooks"
status = "approved"
reason = "Requested 2026-11-08 (feat/round-hooks): the game fires game_mission_success when a co-op mission is accomplished (game_end, change_touch) and game_mission_failed when it fails (mission_failed, the round limit), once per map, with the world as activator, as game_round_start. 1.38 had no such hooks. No stock or custom map names an entity game_mission_success / game_mission_failed / game_round_failed / game_round_<N> (scan 2026-11-08), so the only difference is the fire line itself; nothing receives it. docs/ROUNDS.md 'Map hooks'."

[[decision]]
id = "new-classes-stock-maps"
status = "approved"
reason = "Stock maps edited for 2.0 carry classes 1.38 does not have: env_rain / env_snow (bk_mongolito, br_mongolito, co_carnage, co_kill-the-doc), game_timer (co_siege, co_forgottenworld, fix/sky-timer-tutor 2598c76e). Stock maps may change (custom-maps rule); SBO-2.0-CHANGES 'Maps and assets'."

[[decision]]
id = "path-corner-yaw-speed"
status = "approved"
reason = "Approved 2026-11-08 (fix/turret-fade-train-yaw): path_corner New Train rot. Speed (yaw_speed) works, as Spirit of Half-Life's path_corner turnspeed: a func_train leaving a corner with a non-zero value turns around its vertical axis at that many degrees a second while it moves, and not while stopped; 0 changes nothing. 1.38 never read the key. Only map affected: co_mictlanparty, whose path_corner B_16 sets 30: the boulder trains BOLDA / BOLDB on the B_15 path (entities 96 and 119) start turning at 30 degrees a second from B_16 and keep turning (no later corner sets a rate). Every other path_corner on the latest maps sets 0. The author is told in docs/MAP_COMPAT.md. Case 97c_path_corner_yaw_speed."

[[decision]]
id = "turret-fade-corpse"
status = "approved"
reason = "Approved 2026-11-08 (fix/turret-fade-train-yaw): monster_turret, monster_miniturret and monster_sentry with monster flag 512 Fade Corpse fade their wreck out about 5 s after they are destroyed (when the death smoke ends) and are removed, as other monsters' corpses fade (Featureful turret.cpp); a monstermaker's turret child fades too when the maker fades its children. 1.38 kept every turret wreck (TurretDeath / SentryDeath never read the flag). Maps: 46 turrets set 512 on 4 stock maps: co_aemos (29 monster_sentry, 4 monster_turret), co_forgottenworld (5 monster_sentry), co_siege (2 monster_sentry), co_fondery (9 monster_miniturret); none has a targetname, so nothing on those maps refers to them after they die. The removed monster_turret and monster_miniturret wrecks were solid (64 and 32 unit wide boxes), the sentry wreck was not solid. No custom map sets the flag on a turret; monstermakers of turrets only on co_amxx. Case 103_turret_fade_corpse."

[[decision]]
id = "monstermaker-start-on-named"
status = "approved"
reason = "Decided 2026-11-08 (fix/monstermaker-start-on): monstermaker flag 1 Start ON works on a maker with a targetname: its first monster comes Frequency seconds after the start (Featureful's fix: Spawn sets nextthink = time + delay) and its first trigger turns it off. 1.38 (Half-Life SDK bug) never started it and its first trigger turned it off. The 49 named Start ON makers on the 5 latest custom maps that have them keep their 1.38 play through maps/map_compat.txt (bk_pipes 8, co_god_damn_the_sun 35, co_prototype 2: cyclic, flag 1 cleared, one monster per trigger as before; co_saibercity_v3 1, co_unxmas 3: Frequency 1000000000). The stock co_escape (2) makers: decision stock-monster-waves; co_hellraiser's 3 (mons) are deleted from its BSP with their beams, as they never made a monster in 1.38. Case 99b_monstermaker_start_on."

[[decision]]
id = "stock-monster-waves"
status = "approved"
reason = "Decided 2026-11-08 (fix/stock-monster-waves): stock map co_escape: the monster waves the authors placed now come; 1.38 never made them. (co_hellraiser, decided 2026-11-09: its three mons makers, their beams gho1-3 and the beam end points ghot1-3 are deleted from the shipped BSP, 330 -> 321 entities, CRC32 e8a14d48 -> 6262b719, so it plays as in 1.38; the text below is the history.) Both maps ship their 1.38 BSPs unchanged (co_escape c52634ac, co_hellraiser e8a14d48): their named makers have flag 1 Start ON, which works on develop (decision monstermaker-start-on-named), so they make monsters from the map start and the map's one trigger turns them off. 1.38 never started them (Start ON bug) and that trigger turned them off. co_escape: makers 309 and 310 prison_marines (monster_grunt_hunter, Frequency 10 s, max live 2, count 300), turned off by trigger_once 311. co_hellraiser: makers 261-263 mons (monster_hunter x2, monster_werewolf_hunter; Frequency 5 / 4 / 5 s, max live 1, no count limit; each spawn fires its env_beam gho3 / gho2 / gho1, lightning at the spawn spot), turned off by trigger_once 292 -> multi_manager 329 sucemonrat (mons at 0.2 s), which turns on the karma trigger_hurts 327 / 328 at 0.5 s (start off, no clients, 1000 blast over the makers' area) that kill the monsters waiting there. Replay co_hellraiser: develop fires the beams when the makers make their first monsters (segments @@FIRE bz1 / bz3), 1.38 only after the replay's sucemonrat turned the makers on (the replay fires every name once). Case 99d_stock_monster_waves."

[[decision]]
id = "stand-timers-2min"
status = "approved"
reason = "db740251 (fix/stand-timers-2min, approved 2026-11-07): the co_siege and co_forgottenworld survival stand timers are 2 minutes (the 2026-10-11 version). co_siege's game_timer starts after the messages (@@FIRE shake, was go), co_forgottenworld's from the final arena's trigger_once (murdeouf, was carmen)."

[[decision]]
id = "rc-kart-env-fog"
status = "approved"
reason = "Approved: decided 2026-11-07 (the rc_ kart maps are the project's own; no change wanted). rc_kart_circuit_day / rc_kart_circuit_night (the project's own maps) have an env_fog (density 0.000075), a class 1.38 does not have: develop draws a very faint fog. Open decision since the 2026-11-05 map check (map regression audit C, D3)."

[[decision]]
id = "rot-button-no-spark"
status = "approved"
reason = "SDK update server-core #24 (halflife-updated): a func_rot_button's X-axis spawnflag no longer turns sparks on. On 1.38, bk_technocave / br_technocave's rotating buttons sparked with spark sounds they never precached (engine-error lines). Merged with feat/sdk-update, approved."

[[decision]]
id = "mission-end-between-rounds"
status = "approved"
reason = "co_convoy_b4: the replay fires 'victory' (game_end) at 25.8 s with no round running. Develop ends the mission at once and goes to the intermission (b0c166ea, round rework, decided 2026-10-11); 1.38 waits for a round. The replay then runs on in another game state: from ~116 s the second apache maker spawns on develop only (the same maker alone behaves the same on both binaries)."

[[decision]]
id = "breakable-explode-once"
status = "awaiting-decision"
reason = "74c5ad52 (halflife-updated: CBreakable::Die returns when the breakable is already SOLID_NOT): a func_breakable with explodemagnitude that a trigger breaks dies once; on 1.38 its own blast hit it again (two explosions, target fired twice). co_omega17_v3, replay only: the stub engine gives brush entities no BSP bounds, so every func_breakable without an origin key sits at 0 0 0 and its blast reaches all the others (traces are always clear). Firing Bunker_GrenadeTrap (*109, magnitude 69) takes #129 (*77, health 128, target HydraAC) and #524 (*295, health 128, target SnakeAlert) to 59; on 1.38 the trap's second blast breaks #129, and #129's own blast plus the trap's blasts break #524, so HydraAC / SnakeAlert fire in that window. On develop the trap blasts once and both break when MetalDeer (*292, magnitude 69, also at 0 0 0 in the stub) is fired. In the map the trap (1637 884 265) is 751 units from #129 (972 928 612) and 1106 from #524 (2624 532 -88), MetalDeer (3286 930 -362) 820 from #524; the blasts reach 172 units (the trap's env_explosion 360). Neither blast reaches them in play: players break them, the same on both builds; in play the bunker trap makes one 69 blast instead of two. The same hunk: a func_breakable Used twice in one frame dies once (one spawnobject, one target fire; 1.38 two each), case 100c. Case 102b: a trigger breaks one with explodemagnitude, its target fires once (1.38 twice). Map regression audit A: DIFFERENT, needs a decision."

[[decision]]
id = "breakable-directed-gibs"
status = "approved"
reason = "74c5ad52 (halflife-updated #24): func_breakable Gibs Direction \"1\" (the FGD value, 17 latest maps) sends the gibs away from the attack at 200 units/s; 1.38 read only the words directed / random, so \"1\" gave random gibs (base velocity 0). Approved 2026-11-07 (visual only). Case 94b_func_breakable_directed_gibs."

[[decision]]
id = "func-rotating-volume"
status = "approved"
reason = "Merge 70147bc2 (fix/func-rotating-volume, approved 2026-11-07): func_rotating reads \"volume\" (what the FGD and map tools write) as well as \"Volume\"; 1.38 read only \"Volume\", so every func_rotating played at full volume. Case 95b_func_rotating_volume."

[[decision]]
id = "turret-sight-timing"
status = "same-total"
reason = "co_fondery: the miniturrets (spawnflags 544) fire s_2 / s_3 when they see a target; in the stub that happens at another moment on develop (monster AI timing). The same lines, the same number of times (map regression audit A: SAME)."

[[decision]]
id = "showcase-2-0-map"
status = "approved"
reason = "co_sbo_showcase is SBO 2.0's own showcase map (in the game since 2c0290b): it uses classes and keys 1.38 does not have. Compared so that a crash or hang on develop shows."

[[decision]]
id = "failed-mission-no-vote"
status = "approved"
reason = "0e6ebd1e: after a failed mission the game goes to the intermission and the next map; 1.38 opened the 'Reload map?' vote and stayed (decided: remove the failed-mission restart vote; map regression audit B row 4)."

[[decision]]
id = "apache-ai-trigger"
status = "approved"
reason = "halflife-updated VS#3262: monster_apache's AI trigger (TriggerCondition / TriggerTarget) now runs; on 1.38 it never fired and the apache never set deadflag (fix/hlu-missed #9, tested in game 2026-10-16). No map sets a trigger on an apache (map regression audit B row 22)."

[[decision]]
id = "gag-spawnflag"
status = "approved"
reason = "halflife-updated VS#3076: the Gag spawnflag (2) is read from spawnflags, so gagged NPCs make no idle sounds (server-ai.md #9, feat/sdk-update merged as a package; approved 2026-11-07: a mapper who set Gag meant it (audit C D1, 71 NPCs on 7 custom maps); map regression audit B row 30). The ungagged NPC's counts and, in 51_dark_sf595 (595 includes Gag), the player's spawn spot change too: the stub's shared random sequence is used differently. Checked: the ungagged NPC alone, and monster_dark 593 (595 without Gag), give the same results on both binaries."

[[decision]]
id = "sbo2-mapper-options"
status = "approved"
reason = "Opt-in mapper keys and flags that 1.38 does not have, merged into develop as approved features (no 1.38 map sets them; 1.38 ignores the key or flag, so the spec cases show them working on develop only): multi_manager 8 Once only / 1024 Instant and trigger_multiple 8 Everything else (feat/featureful-options 18c634fb); trigger_relay Trigger State -1 / -2 and flags 64 / 128, env_global flag 4 Act as Master, inverted '~' masters (feat/mapper-entities 3fc2d68b, docs/STATE_LOGIC.md); env_global Trigger Mode 5, monster TriggerAltCondition and trigger_on_death (feat/featureful-guide-entities add84b3b); monstermaker childtriggertarget / childtriggercondition (cadc2047, feat/sdk-update-ai af077b5b)."

[[decision]]
id = "master-button-target-trigger-hurt"
status = "approved"
reason = "Approved 2026-11-07 (feat/button-target-master): button_target and trigger_hurt honor their master (the FGD offered it; the HL SDK and 1.38 ignored it). Locked: a button_target is not turned on (func_button parity) and a trigger_hurt neither hurts nor fires. No 1.38 map sets a master on either class (map scan 2026-11-08)."

[[decision]]
id = "null-activator-no-crash"
status = "approved"
reason = "1.38's game_text (without All Players), game_player_hurt, game_score, game_player_team and game_player_equip called a method on a NULL activator, so a stock trigger_relay with a delay, a func_breakable or any delayed target that reaches them without a player crashed the 1.38 server (SIGSEGV in the stub). develop checks for NULL (halflife-updated #246, 74c5ad52, merged with feat/sdk-update-server 771be256, approved) and keeps delayed activators (3a88d857): nobody gets the text, the target fires, the map goes on. The replay of every map shows no such crash, so no 1.38 map took this path."

[[decision]]
id = "tier2-changelevel-current-map"
status = "approved"
reason = "Approved: SDK map entity fixes (74c5ad52), approved with the SDK update. 74c5ad52 (halflife-updated, feat/sdk-update): a trigger_changelevel whose map is the running map prints an error for the mapper at spawn; 1.38 said nothing. Message only, no behavior change. No 1.38 map has a trigger_changelevel (map scan 2026-11-08). Case 100b; reported by the tier 2 tests."

[[decision]]
id = "tier2-unusable-model-removed"
status = "approved"
reason = "Approved: crash fix (no map change ends on a missing model), approved with the SDK update. e195864b (fix/sanitizer-audit dcb5306b): cycler, cycler_sprite, env_sprite, monster_furniture, env_shooter and cycler_weapon whose model the server does not have (or none, or models/editor/) are removed with a developer message; 1.38 kept them and a stock engine ended the map at the precache (Host_Error; the stub records no precache error for a missing file, so it shows only as the entity counts). Maps using these classes load the same when their files exist. Case 100e; reported by the tier 2 tests."

[[decision]]
id = "tier2-nan-volume"
status = "approved"
reason = "Approved: sanitizer fix, approved. c12216b9 (fix/sanitizer-audit): a func_rotating / func_plat-type / scripted_sentence volume of nan or inf reads as unset (default volume) with a developer message; 1.38 sent the sound with a NaN volume. No 1.38 map sets such a volume (map scan 2026-11-08). Case 100f; reported by the tier 2 tests."

[[decision]]
id = "tier2-equip-count-cap"
status = "approved"
reason = "Approved: sanitizer fix, approved. 2a1d0ba1 (fix/sanitizer-audit): game_player_equip gives at most 100 items per key (message for the mapper); 1.38 gave the full count (a huge one hung the server or ran out of edicts). Maps use at most 20. Case 100g; reported by the tier 2 tests."

[[decision]]
id = "tier2-grunt-hunter-repel"
status = "approved"
reason = "Approved: 1.38 crashed; fix approved. 4fed0952 (fix/sanitizer-audit): monster_grunt_hunter_repel precaches and makes a monster_grunt_hunter; the 1.38 server crashed (SIGSEGV in the stub) when it was fired. No 1.38 map has the class (map scan 2026-11-08). Case 100i; reported by the tier 2 tests."

[[decision]]
id = "tier2-light-style-range"
status = "approved"
reason = "Approved: sanitizer fix, approved. 2a54e427 (light style range check, feat/mapper-entities): a light whose style is outside the engine's 0-63 is not set when fired; 1.38 wrote past the engine's light style table. No 1.38 map has such a style (map scan 2026-11-08). Case 100k; reported by the tier 2 tests."

[[decision]]
id = "tier2-sentry-keyvalues"
status = "approved"
reason = "Approved: HL SDK behavior restored (aec5d324), approved. aec5d324: monster_sentry uses CBaseTurret::KeyValue as the HL SDK, so orientation (1 = ceiling: upside down, EF_INVLIGHT), turnrate and maxsleep work; 1.38's own KeyValue ignored them. 22 maps place monster_sentry, none sets orientation, turnrate, maxsleep or searchspeed (map scan 2026-11-08). Case 100l; reported by the tier 2 tests."

[[decision]]
id = "tier2-sentence-on-toggles"
status = "approved"
reason = "Approved: halflife-updated fix, approved with the SDK update. 69e09dc3 (HL25): scripted_sentence can make a func_button (any toggle that may speak) say its sentence; 1.38 looked for monsters only. The maps' scripted_sentences all speak through a monster_barney (BarneyAlly: co_god_damn_the_sun, co_omega17_v3). Case 100m; reported by the tier 2 tests."

[[decision]]
id = "tier2-maker-slot-freed"
status = "approved"
reason = "Approved: SDK_UPDATE Monstermaker + killtarget slots, approved. 944bf586 (Valve #1746/#1747): a monster removed while alive (killtarget, trigger_killmonster) frees its monstermaker's live-child slot, so a maker at its max live count makes its next child; 1.38 kept counting the removed child and never made another. Maps that killtarget a maker's living children with a max live count see more monsters. Case 100n; reported by the tier 2 tests."

[[decision]]
id = "tier2-hardcore-default"
status = "approved"
reason = "Approved: mp_hardcore 100 decided 2026-10-14. 4755c07b: mp_hardcore defaults to 100 (the whole team must die for a co-op round to fail; server.cfg / listenserver.cfg set 100 too). With the cvar left at its default, 1.38 failed the round when one of two players died. Servers that set mp_hardcore in their cfg see no change. Case 101; reported by the tier 2 tests."

[[decision]]
id = "tier2-spectators-not-counted"
status = "approved"
reason = "Approved: spectators are not players (decided 2026-10). feat/spectate d2547071 (719d7d4e, spectators never count toward game metrics): a player in spectator mode is not waited for and does not keep a round going; the round starts with the others and fails when they die. 1.38 has no spectator mode (the 'spectate' command did nothing), so its round waited for the second player's loadout. Case 101b; reported by the tier 2 tests."

[[decision]]
id = "tier2-loadouttime"
status = "approved"
reason = "Approved: round rework, decided 2026-10-11. 10b402b5 (mp_loadouttime, approved cvar): a round starts without a player who has not touched the loadout menus for mp_loadouttime seconds (default 45; 0 waits for everybody as SBO did). 1.38 waited for every player. Case 101c (mp_loadouttime 10); reported by the tier 2 tests."

[[decision]]
id = "tier2-missionendtime"
status = "approved"
reason = "Approved: round rework, decided 2026-10-11. 802ed4bf (mp_missionendtime, approved cvar): the intermission comes mp_missionendtime seconds after the mission result. 1.38 had no such cvar; in the stub its intermission had not come 4 s after the result. Case 101d (mp_missionendtime 3); reported by the tier 2 tests."

[[decision]]
id = "tier2-mission-end-observers"
status = "approved"
reason = "Approved: round rework, decided 2026-10-11. 3e42afef / 5c85075a: at a mission end held longer than 5 s (mp_missionendtime 30) the living players become observers 5 s after the result (spectator messages); 1.38 left them as they were. Case 101f; reported by the tier 2 tests."

[[decision]]
id = "tier2-dying-monster-triggered"
status = "approved"
reason = "Approved: halflife-updated fix, approved with the SDK update. 03c2ff48 (halflife-updated VS#3061, feat/sdk-update): a monster fired by its name while it dies stays dying and ends dead (DEAD_DEAD); on 1.38 MonsterUse set it back to ALERT and it stayed in DEAD_DYING. Maps that fire a monster's name (scripts, relays) right as it dies see a normal corpse. Case 102; reported by the tier 2 tests."

[[decision]]
id = "maker-child-keys-native"
status = "approved"
reason = "Monstermaker child keys natively (production audit #20, SBO-2.0-CHANGES 'Monstermaker child keyvalues natively'): Children's weapons reach each child; the 1.38 binary ignored them (the monstermaker_weapons plugin did it on the servers). Case 112b_maker_child_weapons."

[[decision]]
id = "nuke-afterglow"
status = "approved"
reason = "SBO-2.0-CHANGES 'nuclear_explosion: the afterglow shows' (ordered 2026-11-02): CNuke::Use set the AfterGlow think without a nextthink in 1.38, so the afterglow (v14-v16) never showed; develop sends it when the glow (v8) ends. Case 120_nuclear_explosion."

[[decision]]
id = "slave-spawnflags-kept"
status = "approved"
reason = "fix/slave-spawnflags (merge 77f6d28, c05d50a; SBO-2.0-CHANGES 'Alien slaves, demon slaves and werewolves keep their map flags'): 1.38 cleared the spawnflags of monster_alien_slave, monster_werewolf and monster_werewolf_hunter at their first schedule, so WaitTillSeen (1) was gone before a player looked at them; develop keeps the flag until he does. Cases 116e / 116f / 116m."

[[decision]]
id = "tier5-sbo2-classes"
status = "approved"
reason = "Tier 5 spec cases (200 and up) of SBO 2.0 classes that 1.38 does not have (ambient_random: feat/featureful-guide-entities, docs/FEATUREFUL_GUIDE_ENTITIES.md; env_elight: docs/ENV_DLIGHT.md): 1.38 cannot spawn the class, so the case fails there and its expectations show on develop only. No 1.38 map uses these classes."

[[decision]]
id = "rot-button-lock-sounds"
status = "approved"
reason = "func_rot_button plays its Locked / Unlocked Sound and Sentence (1.38 bug: CRotButton::Spawn never ran CBaseButton::Precache, so it played none). Merged with fix/fgd-mismatches 6b896ee0 (Featureful 814a09dd); no stock or custom map sets these keys on a func_rot_button. Tier 5 case 201 shows them on develop only."

[[decision]]
id = "changetarget-delay"
status = "approved"
reason = "Approved 2026-11-08 (fix/fgd-findings-tier45): trigger_changetarget honors 'Delay before trigger' (FGD base Targetx, Half-Life FGD); 1.38 (and the Half-Life SDK) set the new target at once and never read the delay. Stock maps only: co_iss-555-cargo (changetarget m_reactor, 2 s: trigger aaa switches bozo -> counter 2 s after the end button) and co_necropolis (off, 5 s: trigger ref switches po_bidon -> po; po, 2 s: gogolito switches bozo -> end). Case 123b."

[[decision]]
id = "chaptertitle-all-players"
status = "approved"
reason = "Approved 2026-11-08 (fix/elight-defaults-chaptertitle): worldspawn Chapter Title Message goes to every player once per map, when the player first enters the game (spawned in play, spectating or Game Master), players who join later too; not again on a respawn or a new round. 1.38 (as Half-Life) made an env_message 0.3 s into the map with no activator, which showed it to player 1 only. Maps: co_light_up_the_night, co_saibercity_v3. Case 127b_chapter_title."

[[decision]]
id = "tier5-flag-cases-138"
status = "approved"
reason = "Approved 2026-11-08. Cases 128b / 128c (generated monster flag cases): monster_hunter keeps WaitTillSeen (1) while it stands behind a player (1.38 cleared it without being seen), the same family as the approved slave-spawnflags-kept fix; no latest map sets WaitTillSeen on monster_hunter. TriggerCondition 10 (See Player, unconditional) now fires on monster_generic and monster_human_assassin (1.38 never fired it); the only latest map using it is co_bankjob_v4 (one assassin with TriggerCondition 10 and no TriggerTarget), so nothing fires and no map changes."

[[decision]]
id = "multi-manager-64-targets"
status = "approved"
reason = "multi_manager takes up to 64 targets (Half-Life Unified SDK; 16 before, fix/hlu-batch-1). co_boarding's managers have editor keys past 16 (state, delay, triggerstate, nbmaxround, FireColor) that name no entity: only the Firing lines are new, nothing is triggered. co_escape: multi_plafond2's 17th target plafond_mortar (an ambient_generic sound) now plays; esc_prison's 7 extra prison-light toggles were removed from the shipped BSP's entity lump, so the lights are as in 1.38."

[[decision]]
id = "multi-manager-mortar-strikes"
status = "approved"
reason = "co_dfs and co_rain_of_fire: multi_1's targets after the first 16 (m_1, s_1, rs_1, m_2, s_2, rs_2: mortar strikes 1 and 2, their sounds, sprites and shakes, and the relays that loop them) now fire with the 64-target limit (fix/hlu-batch-1); strikes 1 and 2 now fire, decided 2026-11-09. The BSPs ship unchanged."

[[decision]]
id = "turret-death-trigger"
status = "approved"
